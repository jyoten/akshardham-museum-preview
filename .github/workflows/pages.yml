# Builds the site with Eleventy and publishes it to GitHub Pages on every push to main.
name: Publish preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The repository name becomes the URL path: https://<owner>.github.io/<repo>/
      # SITE_REVIEW=1: not indexed, no /admin, "preview" note on every page.
      - run: npm run build
        env:
          SITE_PREFIX: /${{ github.event.repository.name }}
          SITE_REVIEW: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
