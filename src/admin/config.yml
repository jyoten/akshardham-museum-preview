  - name: "pages"
    label: "Page layouts"
    label_singular: "page"
    description: "Which components make up each page, in order. Each component is a style (a design in src/_includes/components) showing one topic. Changing these changes the page structure; new styles need a developer."
    folder: "src/content/pages"
    extension: "json"
    format: "json"
    identifier_field: "path"
    slug: "{{slug}}"
    summary: "{{path}}"
    create: false
    delete: false
    editor:
      preview: false
    fields:
      - name: "path"
        label: "Address"
        widget: "string"
      - name: "nav"
        label: "Highlighted menu item"
        widget: "string"
        required: false
      - name: "meta"
        label: "Page title topic"
        widget: "string"
        hint: "document/topic whose title is the browser-tab title"
      - name: "headerStyle"
        label: "Header style (CSS)"
        widget: "string"
        required: false
      - name: "components"
        label: "Components"
        label_singular: "component"
        widget: "list"
        summary: "{{fields.style}}: {{fields.topic}}"
        fields:
          - name: "style"
            label: "Style"
            widget: "select"
            options:
              - "access-directions"
              - "breadcrumb"
              - "chapters"
              - "cta-band"
              - "era-data"
              - "era-panel"
              - "era-picker"
              - "essentials"
              - "exhibit-hero"
              - "faq"
              - "feature-cards"
              - "feature-split"
              - "first-visit"
              - "floor-map"
              - "footnote"
              - "gallery-grid"
              - "gallery-items"
              - "home-hero"
              - "intro-split"
              - "key-facts"
              - "learning-paths"
              - "legacy-hall"
              - "link-cards"
              - "membership-tiers"
              - "message"
              - "nearby-cards"
              - "page-hero"
              - "quotes"
              - "related-cards"
              - "routes"
              - "site-header"
              - "sponsorship-row"
              - "stats-band"
              - "support-hero"
              - "tickets"
              - "timeline-band"
              - "timeline-hero"
              - "timeline-teaser"
              - "today-strip"
              - "visit-hero"
          - name: "topic"
            label: "Topic"
            widget: "string"
            required: false
            hint: "document/topic, e.g. home/hero"
          - name: "settings"
            label: "Settings"
            widget: "object"
            required: false
            collapsed: true
            fields:
              - name: "headingId"
                label: "Heading id"
                widget: "string"
                required: false
              - name: "imagePosition"
                label: "Image position (CSS object-position)"
                widget: "string"
                required: false
              - name: "lazyImages"
                label: "Load images lazily"
                widget: "boolean"
                required: false
