          - { name: ajanta_026, label: "Their wall paintings — courtly scenes, animals, stories of the Buddha…", widget: text, required: false, hint: "English: Their wall paintings — courtly scenes, animals, stories of the Buddha’s past lives — are among the most important surviving examples of ancient Indian painting. Abandoned and overgrown, the caves were brought to wider attention in 1819." }
